server {
    listen 80;
    server_name _;

    # Apply browser hardening to both the SPA and proxied API responses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

    # SPA history 路由回退
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # v2 AI 使用普通 SSE；关闭缓冲，确保步骤/令牌实时到达浏览器。
    location /api/v2/ai/ {
        # Allow the configured 20 MiB knowledge upload plus multipart overhead.
        client_max_body_size 21m;
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600;
    }

    # Operational endpoints are not public browser APIs. Liveness is used by
    # container-local health checks against FastAPI, not through this proxy.
    location = /api/v2/ready { return 404; }
    location = /api/v2/metrics { return 404; }

    # 后端 REST API 反代
    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Notification streams must pass through incrementally so EventSource can
    # reconnect with Last-Event-ID and the server can replay missed rows.
    location = /api/v2/notifications/stream {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
