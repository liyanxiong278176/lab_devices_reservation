[project]
name = "lab-reservation-backend"
version = "0.1.0"
description = "Optional migration, database and browser verification tools; Java is the backend"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2.0",
  "asyncmy>=0.2.10,<1.0",
  "pwdlib[argon2]>=0.2.1,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "redis[hiredis]>=6.4,<7.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "tzdata>=2024.1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1.0",
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "pytest-cov>=7.1,<8.0",
  "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = []

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "scripts", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
