[project]
name = "lab-reservation-backend"
version = "0.1.0"
description = "FastAPI backend for the laboratory equipment reservation platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2.0",
  "asyncmy>=0.2.10,<1.0",
  "fastapi>=0.116,<1.0",
  "langchain>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "pwdlib[argon2]>=0.2.1,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "pyjwt[crypto]>=2.10,<3.0",
  "qdrant-client>=1.15,<2.0",
  "redis[hiredis]>=6.4,<7.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "tzdata>=2024.1",
  "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1.0",
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
