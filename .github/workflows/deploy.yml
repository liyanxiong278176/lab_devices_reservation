name: Deploy production services

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labprod-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  deploy:
    name: Deploy and verify complete release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: /www/wwwroot/lab_devices_reservation
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH credentials
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for key in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing required Actions secret: $key"
              exit 1
            fi
          done
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && (( DEPLOY_PORT > 0 && DEPLOY_PORT < 65536 ))
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/deploy_key" >/dev/null
      - name: Upload clean release source
        shell: bash
        run: |
          set -euo pipefail
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_options=(-i "$RUNNER_TEMP/deploy_key" -p "$DEPLOY_PORT"
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" -o ConnectTimeout=20
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8)
          # mktemp creates an empty context. Overlaying a checkout leaves removed modules behind.
          printf -v prepare 'test -r %q/.env && mkdir -p %q/.releases && mktemp -d %q/.releases/%q.XXXXXX' \
            "$DEPLOY_PATH" "$DEPLOY_PATH" "$DEPLOY_PATH" "$GITHUB_SHA"
          release_path="$(ssh "${ssh_options[@]}" "$target" "$prepare")"
          [[ "$release_path" == "$DEPLOY_PATH/.releases/$GITHUB_SHA."* ]]
          printf -v extract 'tar -xzf - -C %q --no-same-owner' "$release_path"
          # Runtime inputs only; never upload local secrets, generated files, or screenshot archives.
          git archive "$GITHUB_SHA" Dockerfile .dockerignore docker-compose.prod.yml \
            backend-java frontend monitoring scripts docs/springboot-cutover.md \
            | gzip -1 | ssh "${ssh_options[@]}" "$target" "$extract"
          echo "RELEASE_PATH=$release_path" >> "$GITHUB_ENV"
      - name: Build, migrate, and verify production release
        shell: bash
        run: |
          set -euo pipefail
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_options=(-i "$RUNNER_TEMP/deploy_key" -p "$DEPLOY_PORT"
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" -o ConnectTimeout=20
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8)
          printf -v deploy 'bash %q/scripts/deploy-production.sh %q %q %q' \
            "$RELEASE_PATH" "$DEPLOY_PATH" "$RELEASE_PATH" "$GITHUB_SHA"
          ssh "${ssh_options[@]}" "$target" "$deploy"
      - name: Verify public HTTPS release
        shell: bash
        run: |
          set -euo pipefail
          base=https://www.labdevicesreservation.online
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "$base/version.json" > /tmp/version.json
          python3 -c 'import json,sys; assert json.load(open("/tmp/version.json"))["revision"] == sys.argv[1]' "$GITHUB_SHA"
          curl --fail --silent --show-error "$base/api/v2/live"
          curl --fail --silent --show-error "$base/api/v2/auth/csrf" > /dev/null
          # Evidence photos larger than nginx's default 1 MB must reach the API.
          # Missing credentials/CSRF ensure this probe cannot create an upload.
          head -c 2097152 /dev/zero > /tmp/upload-probe
          status="$(curl --silent --show-error --max-time 30 -o /tmp/upload-result \
            -w '%{http_code}' -H "Origin: $base" -H 'Content-Type: application/octet-stream' \
            --data-binary @/tmp/upload-probe "$base/api/v2/repair-uploads")"
          [[ "$status" == 401 || "$status" == 403 ]]
