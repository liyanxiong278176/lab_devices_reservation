name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: lab_reservation
          MYSQL_USER: lab_runtime
          MYSQL_PASSWORD: ci-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      CI: "true"
      LAB_AI_CI_DEEPSEEK_KEY: ${{ secrets.LAB_AI_CI_DEEPSEEK_KEY }}
      LAB_ENVIRONMENT: test
      LAB_MYSQL_DSN: mysql+asyncmy://lab_runtime:ci-app-password@127.0.0.1:3306/lab_reservation?charset=utf8mb4
      LAB_REDIS_URL: redis://127.0.0.1:6379/0
      LAB_JWT_SECRET: ci-only-jwt-secret-not-used-outside-tests-32chars
      LAB_METRICS_TOKEN: ci-only-metrics-token-not-used-outside-tests
      LAB_CORS_ORIGINS: '["http://test","http://127.0.0.1:5173"]'
      LAB_RATE_LIMIT_ENABLED: "false"
      LAB_ENABLE_WORKERS: "false"
      LAB_RUN_MYSQL_INTEGRATION: "1"
      LAB_RUN_REDIS_INTEGRATION: "1"
      LAB_RUN_1000_CONCURRENCY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Lint backend
        working-directory: backend
        run: uv run ruff check .
      - name: Upgrade isolated MySQL schema
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Test backend and live DeepSeek connectivity
        working-directory: backend
        run: uv run pytest -q
      - name: Measure non-AI backend coverage
        working-directory: backend
        run: >-
          uv run pytest -q
          --ignore-glob=tests/test_ai_*.py
          --deselect=tests/test_upload_quotas.py::test_ai_knowledge_storage_quota_is_cumulative_by_global_and_college_scope
          --cov=app
          --cov-branch
          --cov-report=term
          --cov-fail-under=100
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Test frontend
        working-directory: frontend
        run: pnpm test
      - name: Measure non-AI frontend coverage
        working-directory: frontend
        run: pnpm test:coverage
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
      - name: Install Chromium for browser tests
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Test real user and administrator pages
        working-directory: frontend
        run: pnpm exec playwright test -c playwright.config.ts --grep-invert "管理员实际浏览 AI 对话"
