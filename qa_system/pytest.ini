[pytest]
asyncio_mode = auto
testpaths = backend_tests ai_tests integration
addopts = -ra --strict-markers
markers =
    mysql: requires the isolated QA MySQL schema
    redis: requires the isolated QA Redis database
    qdrant: requires the isolated QA collection
    ai_integration: exercises the isolated API, AI provider mock, and reservation persistence
    live: requires explicit AI_RUN_LIVE=1 and is excluded from offline conclusions
