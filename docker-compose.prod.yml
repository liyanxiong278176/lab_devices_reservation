# 顶级 name 固定项目名为 labprod：避免与 dev 的 docker-compose.yml（默认目录项目名）
# 同名 service(mysql/redis) 碰撞导致 prod up 误重建 dev 容器。
# 这样 `docker compose -f docker-compose.prod.yml up -d` 即安全，无需每次带 -p labprod。
#
# ============================================================
# 默认值策略：所有 ${VAR} 都有 :-default 兜底
#   - 不写 .env 也能起来（适合"先跑起来再说"）
#   - 想要强密码：在项目根写 .env 文件覆盖即可
#   - 4G 机器内存分配：mysql 512M / redis 128M / qdrant 256M / app 768M / frontend 64M
# ============================================================
name: labprod

services:
  mysql:
    image: mysql:8.0
    container_name: lab-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-LabSecurePwd2026}
      MYSQL_DATABASE: lab_reservation
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    volumes: ["mysql_data:/var/lib/mysql"]
    # 公网直连:监听 0.0.0.0 让外部直接访问。腾讯云安全组务必限制源 IP 或确认 DB_PASSWORD 是强密码!
    ports:
      - "0.0.0.0:3306:3306"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-LabSecurePwd2026}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["redis_data:/data"]
    # 公网直连:监听 0.0.0.0 让外部直接访问。腾讯云安全组务必限制源 IP 或确认没有 requirepass 风险!
    ports:
      - "0.0.0.0:6379:6379"
    mem_limit: 128m
  qdrant:
    image: qdrant/qdrant:v1.14.1
    restart: unless-stopped
    volumes: ["qdrant_data:/qdrant/storage"]
    expose: ["6333"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    environment:
      LAB_ENVIRONMENT: prod
      LAB_DEBUG: "false"
      LAB_MYSQL_DSN: mysql+asyncmy://root:${DB_PASSWORD:-LabSecurePwd2026}@mysql:3306/lab_reservation?charset=utf8mb4
      LAB_REDIS_URL: redis://redis:6379/0
      LAB_QDRANT_URL: http://qdrant:6333
      LAB_JWT_SECRET: ${JWT_SECRET:-change-this-production-secret-at-least-32-characters}
      LAB_CORS_ORIGINS: '["http://localhost"]'
      LAB_ENABLE_WORKERS: "true"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v2/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["80:80"]
    depends_on:
      app: { condition: service_healthy }
    mem_limit: 64m
volumes:
  mysql_data:
  redis_data:
  qdrant_data:
