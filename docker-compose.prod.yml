# 顶级 name 固定项目名为 labprod：避免与 dev 的 docker-compose.yml（默认目录项目名）
# 同名 service(mysql/redis) 碰撞导致 prod up 误重建 dev 容器。
# 这样 `docker compose -f docker-compose.prod.yml up -d` 即安全，无需每次带 -p labprod。
#
# ============================================================
# 生产环境不再为数据库密码和 JWT 密钥提供默认值；缺失时直接拒绝启动。
#   - 4G 机器内存分配：mysql 512M / redis 128M / qdrant 256M / app 768M / Celery worker 768M / frontend 64M
# ============================================================
name: labprod

x-backend-environment: &backend-environment
  # Backend receives only application settings, never DB root or monitoring credentials.
  LAB_ENVIRONMENT: "${LAB_ENVIRONMENT:-}"
  LAB_DEBUG: "${LAB_DEBUG:-}"
  LAB_API_PREFIX: "${LAB_API_PREFIX:-}"
  LAB_MYSQL_DSN: "${LAB_MYSQL_DSN:-}"
  LAB_REDIS_URL: "${LAB_REDIS_URL:-}"
  LAB_CELERY_BROKER_URL: "${LAB_CELERY_BROKER_URL:-}"
  LAB_CELERY_VISIBILITY_TIMEOUT_SECONDS: "${LAB_CELERY_VISIBILITY_TIMEOUT_SECONDS:-}"
  LAB_CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: "${LAB_CELERY_TASK_SOFT_TIME_LIMIT_SECONDS:-}"
  LAB_CELERY_TASK_TIME_LIMIT_SECONDS: "${LAB_CELERY_TASK_TIME_LIMIT_SECONDS:-}"
  LAB_CELERY_WORKER_CONCURRENCY: "${LAB_CELERY_WORKER_CONCURRENCY:-}"
  LAB_AI_KNOWLEDGE_BUILD_EMBED_BATCH_SIZE: "${LAB_AI_KNOWLEDGE_BUILD_EMBED_BATCH_SIZE:-}"
  LAB_AI_KNOWLEDGE_BUILD_LEASE_SECONDS: "${LAB_AI_KNOWLEDGE_BUILD_LEASE_SECONDS:-}"
  LAB_AI_KNOWLEDGE_BUILD_DISPATCH_RECOVERY_SECONDS: "${LAB_AI_KNOWLEDGE_BUILD_DISPATCH_RECOVERY_SECONDS:-}"
  LAB_AI_KNOWLEDGE_BUILD_RECONCILE_INTERVAL_SECONDS: "${LAB_AI_KNOWLEDGE_BUILD_RECONCILE_INTERVAL_SECONDS:-}"
  LAB_AI_KNOWLEDGE_BUILD_MAX_REDELIVERIES: "${LAB_AI_KNOWLEDGE_BUILD_MAX_REDELIVERIES:-}"
  LAB_AI_RAG_QUERY_CONCURRENCY: "${LAB_AI_RAG_QUERY_CONCURRENCY:-}"
  LAB_REDIS_SOCKET_TIMEOUT_SECONDS: "${LAB_REDIS_SOCKET_TIMEOUT_SECONDS:-}"
  LAB_REDIS_CIRCUIT_FAILURE_THRESHOLD: "${LAB_REDIS_CIRCUIT_FAILURE_THRESHOLD:-}"
  LAB_REDIS_CIRCUIT_RECOVERY_SECONDS: "${LAB_REDIS_CIRCUIT_RECOVERY_SECONDS:-}"
  LAB_QDRANT_URL: "${LAB_QDRANT_URL:-}"
  LAB_CORS_ORIGINS: "${LAB_CORS_ORIGINS:-}"
  LAB_TRUSTED_PROXY_IPS: "${LAB_TRUSTED_PROXY_IPS:-}"
  LAB_JWT_SECRET: "${LAB_JWT_SECRET:-}"
  LAB_COOKIE_SECURE: "${LAB_COOKIE_SECURE:-}"
  LAB_ALLOW_INSECURE_COOKIE_FOR_TESTING: "${LAB_ALLOW_INSECURE_COOKIE_FOR_TESTING:-false}"
  LAB_METRICS_TOKEN: "${LAB_METRICS_TOKEN:-}"
  LAB_JWT_ISSUER: "${LAB_JWT_ISSUER:-}"
  LAB_ENABLE_WORKERS: "${LAB_ENABLE_WORKERS:-}"
  LAB_UPLOAD_COLLEGE_QUOTA_BYTES: "${LAB_UPLOAD_COLLEGE_QUOTA_BYTES:-}"
  LAB_AI_KNOWLEDGE_GLOBAL_STORAGE_BYTES: "${LAB_AI_KNOWLEDGE_GLOBAL_STORAGE_BYTES:-}"
  LAB_AI_KNOWLEDGE_COLLEGE_STORAGE_BYTES: "${LAB_AI_KNOWLEDGE_COLLEGE_STORAGE_BYTES:-}"
  LAB_BOOTSTRAP_ADMIN_USERNAME: "${LAB_BOOTSTRAP_ADMIN_USERNAME:-}"
  LAB_BOOTSTRAP_ADMIN_PASSWORD: "${LAB_BOOTSTRAP_ADMIN_PASSWORD:-}"
  LAB_DB_POOL_SIZE: "${LAB_DB_POOL_SIZE:-}"
  LAB_DB_MAX_OVERFLOW: "${LAB_DB_MAX_OVERFLOW:-}"
  LAB_DB_POOL_TIMEOUT_SECONDS: "${LAB_DB_POOL_TIMEOUT_SECONDS:-}"
  LAB_REQUEST_QUEUE_CAPACITY: "${LAB_REQUEST_QUEUE_CAPACITY:-}"
  LAB_OUTBOX_MAX_ATTEMPTS: "${LAB_OUTBOX_MAX_ATTEMPTS:-}"
  LAB_OUTBOX_WORKER_CONCURRENCY: "${LAB_OUTBOX_WORKER_CONCURRENCY:-}"
  LAB_NOTIFICATION_STREAM_CONSUMER_CONCURRENCY: "${LAB_NOTIFICATION_STREAM_CONSUMER_CONCURRENCY:-}"
  LAB_NOTIFICATION_STREAM_RETRY_BASE_SECONDS: "${LAB_NOTIFICATION_STREAM_RETRY_BASE_SECONDS:-}"
  LAB_NOTIFICATION_STREAM_MAX_ATTEMPTS: "${LAB_NOTIFICATION_STREAM_MAX_ATTEMPTS:-}"
  LAB_NOTIFICATION_SSE_MAX_CONNECTIONS: "${LAB_NOTIFICATION_SSE_MAX_CONNECTIONS:-}"
  LAB_NOTIFICATION_SSE_MAX_PER_USER: "${LAB_NOTIFICATION_SSE_MAX_PER_USER:-}"
  LAB_NOTIFICATION_SSE_MAX_PENDING: "${LAB_NOTIFICATION_SSE_MAX_PENDING:-}"
  LAB_NOTIFICATION_SSE_MAX_PENDING_PER_IP: "${LAB_NOTIFICATION_SSE_MAX_PENDING_PER_IP:-}"
  LAB_NOTIFICATION_SSE_HEARTBEAT_SECONDS: "${LAB_NOTIFICATION_SSE_HEARTBEAT_SECONDS:-}"
  LAB_NOTIFICATION_SSE_REVALIDATE_SECONDS: "${LAB_NOTIFICATION_SSE_REVALIDATE_SECONDS:-}"
  LAB_NOTIFICATION_SSE_MAX_REPLAY_EVENTS: "${LAB_NOTIFICATION_SSE_MAX_REPLAY_EVENTS:-}"
  LAB_RESERVATION_LOCK_WAIT_SECONDS: "${LAB_RESERVATION_LOCK_WAIT_SECONDS:-}"
  LAB_RESERVATION_LOCK_TTL_SECONDS: "${LAB_RESERVATION_LOCK_TTL_SECONDS:-}"
  LAB_CACHE_DEFAULT_TTL_SECONDS: "${LAB_CACHE_DEFAULT_TTL_SECONDS:-}"
  LAB_CACHE_TTL_JITTER_SECONDS: "${LAB_CACHE_TTL_JITTER_SECONDS:-}"
  LAB_RATE_LIMIT_ENABLED: "${LAB_RATE_LIMIT_ENABLED:-}"
  LAB_RATE_LIMIT_DEFAULT_CAPACITY: "${LAB_RATE_LIMIT_DEFAULT_CAPACITY:-}"
  LAB_RATE_LIMIT_DEFAULT_REFILL_PER_SECOND: "${LAB_RATE_LIMIT_DEFAULT_REFILL_PER_SECOND:-}"
  LAB_RATE_LIMIT_LOGIN_IP_CAPACITY: "${LAB_RATE_LIMIT_LOGIN_IP_CAPACITY:-}"
  LAB_RATE_LIMIT_LOGIN_IP_REFILL_PER_SECOND: "${LAB_RATE_LIMIT_LOGIN_IP_REFILL_PER_SECOND:-}"
  LAB_RATE_LIMIT_LOGIN_CAPACITY: "${LAB_RATE_LIMIT_LOGIN_CAPACITY:-}"
  LAB_RATE_LIMIT_LOGIN_REFILL_PER_SECOND: "${LAB_RATE_LIMIT_LOGIN_REFILL_PER_SECOND:-}"
  LAB_RATE_LIMIT_RESERVATION_CAPACITY: "${LAB_RATE_LIMIT_RESERVATION_CAPACITY:-}"
  LAB_RATE_LIMIT_REPAIR_CAPACITY: "${LAB_RATE_LIMIT_REPAIR_CAPACITY:-}"
  LAB_AI_PROVIDER: "${LAB_AI_PROVIDER:-}"
  LAB_AI_MODEL: "${LAB_AI_MODEL:-}"
  LAB_AI_API_KEY: "${LAB_AI_API_KEY:-}"
  LAB_AI_BASE_URL: "${LAB_AI_BASE_URL:-}"
  LAB_AI_ALLOWED_MODELS: "${LAB_AI_ALLOWED_MODELS:-}"
  LAB_AI_EMBEDDING_PROVIDER: "${LAB_AI_EMBEDDING_PROVIDER:-}"
  LAB_AI_EMBEDDING_MODEL: "${LAB_AI_EMBEDDING_MODEL:-}"
  LAB_AI_EMBEDDING_API_KEY: "${LAB_AI_EMBEDDING_API_KEY:-}"
  LAB_AI_EMBEDDING_BASE_URL: "${LAB_AI_EMBEDDING_BASE_URL:-}"
  LAB_AI_EMBEDDING_DIMENSION: "${LAB_AI_EMBEDDING_DIMENSION:-}"
  LAB_AI_RERANKER_MODEL: "${LAB_AI_RERANKER_MODEL:-}"
  LAB_AI_MINERU_MODEL: "${LAB_AI_MINERU_MODEL:-}"
  LAB_AI_MINERU_API_KEY: "${LAB_AI_MINERU_API_KEY:-}"
  LAB_AI_MINERU_BASE_URL: "${LAB_AI_MINERU_BASE_URL:-}"
  LAB_AI_USER_DAILY_TOKEN_CAP: "${LAB_AI_USER_DAILY_TOKEN_CAP:-}"
  LAB_AI_COLLEGE_DAILY_TOKEN_CAP: "${LAB_AI_COLLEGE_DAILY_TOKEN_CAP:-}"
  LAB_AI_GLOBAL_DAILY_TOKEN_CAP: "${LAB_AI_GLOBAL_DAILY_TOKEN_CAP:-}"
  LAB_AI_QDRANT_COLLECTION: "${LAB_AI_QDRANT_COLLECTION:-}"
  LAB_AI_QDRANT_TIMEOUT_SECONDS: "${LAB_AI_QDRANT_TIMEOUT_SECONDS:-}"

services:
  mysql:
    image: mysql:8.0
    networks: [lab-internal]
    container_name: lab-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: lab_reservation
      MYSQL_USER: ${DB_APP_USER:?DB_APP_USER must be set}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD must be set}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_socket:/var/run/mysqld
    # 数据库只允许 Docker 内部 app 服务访问，不发布到宿主机/公网。
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  redis:
    image: redis:7-alpine
    networks: [lab-internal]
    restart: unless-stopped
    # Broker uses DB 1 and app sessions/cache use DB 0. AOF narrows the broker
    # restart-loss window; noeviction preserves queued/session keys under pressure.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["redis_data:/data"]
    # Redis 只允许 Docker 内部 app 服务访问，不发布到宿主机/公网。
    mem_limit: 128m
  qdrant:
    image: qdrant/qdrant:v1.19.0
    networks: [lab-internal]
    restart: unless-stopped
    volumes: ["qdrant_data:/qdrant/storage"]
    expose: ["6333"]
    mem_limit: 256m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf "GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 &&
          IFS= read -r status <&3 &&
          [[ "$$status" == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 12
  app:
    build: .
    networks: [lab-internal]
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    environment:
      <<: *backend-environment
      LAB_ENVIRONMENT: prod
      LAB_DEBUG: "false"
      # Runtime uses the application account scoped to lab_reservation, never MySQL root.
      LAB_MYSQL_DSN: mysql+asyncmy://${DB_APP_USER:?DB_APP_USER must be set}:${DB_APP_PASSWORD:?DB_APP_PASSWORD must be set}@mysql:3306/lab_reservation?charset=utf8mb4
      LAB_REDIS_URL: redis://redis:6379/0
      LAB_CELERY_BROKER_URL: redis://redis:6379/1
      LAB_QDRANT_URL: http://qdrant:6333
      LAB_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      LAB_COOKIE_SECURE: "${LAB_COOKIE_SECURE:-true}"
      LAB_ALLOW_INSECURE_COOKIE_FOR_TESTING: "${LAB_ALLOW_INSECURE_COOKIE_FOR_TESTING:-false}"
      LAB_CORS_ORIGINS: "[\"${APP_PUBLIC_ORIGIN:?APP_PUBLIC_ORIGIN must be set}\"]"
      # frontend nginx + Docker host gateway; the host TLS proxy must append the real client IP.
      LAB_TRUSTED_PROXY_IPS: '["172.29.0.1/32","172.29.0.2/32"]'
      LAB_ENABLE_WORKERS: "true"
      LAB_METRICS_TOKEN: ${PROMETHEUS_METRICS_TOKEN:?PROMETHEUS_METRICS_TOKEN must be set}
    volumes:
      - app_data:/app/backend/.data
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/v2/live', timeout=4).status == 200"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  celery-worker:
    build: .
    networks: [lab-internal]
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    environment:
      <<: *backend-environment
      LAB_ENVIRONMENT: prod
      LAB_DEBUG: "false"
      LAB_MYSQL_DSN: mysql+asyncmy://${DB_APP_USER:?DB_APP_USER must be set}:${DB_APP_PASSWORD:?DB_APP_PASSWORD must be set}@mysql:3306/lab_reservation?charset=utf8mb4
      LAB_REDIS_URL: redis://redis:6379/0
      LAB_CELERY_BROKER_URL: redis://redis:6379/1
      LAB_QDRANT_URL: http://qdrant:6333
      LAB_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      LAB_COOKIE_SECURE: "${LAB_COOKIE_SECURE:-true}"
      LAB_ALLOW_INSECURE_COOKIE_FOR_TESTING: "${LAB_ALLOW_INSECURE_COOKIE_FOR_TESTING:-false}"
      LAB_METRICS_TOKEN: ${PROMETHEUS_METRICS_TOKEN:?PROMETHEUS_METRICS_TOKEN must be set}
      LAB_ENABLE_WORKERS: "false"
    command: ["uv", "run", "--no-dev", "celery", "-A", "app.infrastructure.tasks.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--prefetch-multiplier=1", "--hostname=knowledge@%h"]
    volumes:
      - app_data:/app/backend/.data
    # One worker process limits simultaneous source files and embedding batches.
    mem_limit: 768m
  frontend:
    build:
      context: ./frontend
      args:
        VITE_WS_BASE: ${VITE_WS_BASE:-}
    networks:
      lab-internal:
        ipv4_address: 172.29.0.2
    restart: unless-stopped
    # 由宿主机上的 TLS 反向代理转发到本地端口；不要直接将明文 HTTP 暴露公网。
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      app: { condition: service_healthy }
    mem_limit: 64m
  mysql-exporter-setup:
    image: mysql:8.0
    networks: [lab-internal]
    restart: "no"
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: lab_reservation
      MYSQL_USER: ${DB_APP_USER:?DB_APP_USER must be set}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD must be set}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?MYSQL_EXPORTER_PASSWORD must be set}
    volumes:
      - mysql_socket:/var/run/mysqld
      - ./monitoring/mysql/setup-exporter-user.sh:/setup-exporter-user.sh:ro
    entrypoint: ["/bin/sh", "/setup-exporter-user.sh"]
    mem_limit: 64m
  mysqld-exporter:
    image: quay.io/prometheus/mysqld-exporter:v0.20.0
    networks: [lab-internal]
    restart: unless-stopped
    depends_on:
      mysql-exporter-setup: { condition: service_completed_successfully }
    environment:
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?MYSQL_EXPORTER_PASSWORD must be set}
    volumes:
      - ./monitoring/mysql/exporter-entrypoint.sh:/etc/mysqld-exporter/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/etc/mysqld-exporter/entrypoint.sh"]
    expose: ["9104"]
    mem_limit: 64m
  redis-exporter:
    image: oliver006/redis_exporter:v1.92.0
    networks: [lab-internal]
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    expose: ["9121"]
    mem_limit: 64m
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    networks: [lab-internal]
    restart: unless-stopped
    command: ["--docker_only=true", "--housekeeping_interval=30s"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    expose: ["8080"]
    mem_limit: 128m
  prometheus:
    image: prom/prometheus:v3.15.0
    networks: [lab-internal]
    restart: unless-stopped
    environment:
      PROMETHEUS_METRICS_TOKEN: ${PROMETHEUS_METRICS_TOKEN:?PROMETHEUS_METRICS_TOKEN must be set}
    volumes:
      - ./monitoring/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/notification-alerts.yml:/etc/prometheus/notification-alerts.yml:ro
      - ./monitoring/prometheus/entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
      - prometheus_data:/prometheus
    entrypoint: ["/bin/sh", "/etc/prometheus/entrypoint.sh"]
    expose: ["9090"]
    mem_limit: 512m
  grafana:
    image: grafana/grafana:13.2.2
    networks: [lab-internal]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000/
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 256m
volumes:
  mysql_data:
  mysql_socket:
  redis_data:
  qdrant_data:
  app_data:
  prometheus_data:
  grafana_data:
networks:
  lab-internal:
    ipam:
      config:
        - subnet: 172.29.0.0/24
